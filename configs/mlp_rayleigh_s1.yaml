# Seed-1 replica of mlp_rayleigh.yaml (differs ONLY in run_name + seed) for the
# one-HVP warm-started power-iteration baseline (n=5 seeds). See
# scripts/analyze_warmstart_baseline.py.
run_name: mlp_rayleigh_s1
seed: 1
device: cuda

model:
  name: mlp
  in_dim: 20
  hidden_dims: [256, 256]
  out_dim: 1
  activation: tanh
  layer_norm: false

data:
  name: teacher_student
  n: 1024
  dim: 20
  difficulty: 0.3
  teacher_hidden: [128, 128]

optimizer:
  type: sgd
  lr: 0.05
  momentum: 0.0
  weight_decay: 0.0

train:
  steps: 3000
  batch_size: full

monitor:
  snapshot_every: 50
  log_every: 500

sharpness:
  enabled: true
  every: 50
  kinds: [lambda_max, rayleigh]   # rayleigh adds λ̂_grad, λ̂_update, cos_*_vtop
  n_iter: 150
  tol: 0.0001
  warm_start_vec: true
