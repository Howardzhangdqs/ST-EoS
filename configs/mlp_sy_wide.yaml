# S&Y bridge — their "wide" 2-layer regime where trajectory alignment HOLDS (m=256).
# Single hidden layer, small regression, full-batch GD. We re-measure cross-seed
# alignment with OUR metric (pooled-PCA PC1 cosine) to calibrate against their claim.
run_name: mlp_sy_wide
seed: 0
device: cuda
model: {name: mlp, in_dim: 20, hidden_dims: [256], out_dim: 1, activation: tanh}
data: {name: teacher_student, n: 64, dim: 20, difficulty: 0.5, teacher_hidden: [64, 64]}
optimizer: {type: sgd, lr: 0.05, momentum: 0.0, weight_decay: 0.0}
train: {steps: 2000, batch_size: full}
monitor: {snapshot_every: 10, log_every: 500}
sharpness: {enabled: true, every: 50, kinds: [lambda_max], n_iter: 120, tol: 0.0001, warm_start_vec: true}
