# Phase-2 EoS reproduction: same MLP/task as milestone-0 but with curvature
# measurement ON. Expected signature: λ_max climbs (progressive sharpening)
# then oscillates around the stability threshold 2/η = 2/0.05 = 40 (EoS).
# Also a cross-check that λ_c ≈ λ_max (they coincide for GD on a local quadratic).
run_name: mlp_ts_eos
seed: 0
device: cuda

model:
  name: mlp
  in_dim: 20
  hidden_dims: [256, 256]
  out_dim: 1
  activation: tanh
  layer_norm: false

data:
  name: teacher_student
  n: 1024
  dim: 20
  difficulty: 0.3
  teacher_hidden: [128, 128]

optimizer:
  type: sgd
  lr: 0.05
  momentum: 0.0
  weight_decay: 0.0

train:
  steps: 3000
  batch_size: full

monitor:
  snapshot_every: 10
  log_every: 500

sharpness:
  enabled: true
  every: 50
  kinds: [lambda_max, lambda_c]
  n_iter: 150
  tol: 0.0001
  tol_power: 4
  lr_guess: 0.05
  warm_start_vec: true
